pre-commit:
  jobs:
    # Lint skips the CLI's template and overlays, and fails when it is handed nothing else, so
    # those files are only formatted.
    - run: bunx oxfmt {staged_files}
      glob:
        - "apps/cli/template/**"
        - "apps/cli/overlays/**"
      stage_fixed: true
    - run: bunx ultracite fix {staged_files}
      exclude:
        - "apps/cli/template/**"
        - "apps/cli/overlays/**"
      glob:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
        - "*.mts"
        - "*.cts"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.scss"
        - "*.less"
        - "*.vue"
        - "*.svelte"
        - "*.astro"
        - "*.html"
        - "*.md"
        - "*.mdx"
        - "*.yaml"
        - "*.yml"
        - "*.graphql"
        - "*.gql"
      stage_fixed: true
